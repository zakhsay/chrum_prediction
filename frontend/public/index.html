<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChurnML — Customer Churn Prediction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Epilogue', 'Segoe UI', system-ui, -apple-system, sans-serif;
        background: #f5f2ed;
        color: #1a1714;
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      #root { height: 100%; }
      ::-webkit-scrollbar { width: 5px; height: 5px; }
      ::-webkit-scrollbar-track { background: #ede9e2; }
      ::-webkit-scrollbar-thumb { background: #c8c1b5; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #afa99f; }
      input[type="range"] { accent-color: #c0392b; cursor: pointer; }
      button { cursor: pointer; font-family: inherit; transition: opacity 0.15s, background 0.15s; }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      select { cursor: pointer; outline: none; font-family: inherit; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
